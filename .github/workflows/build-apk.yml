name: Build VistaStream Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android TV & Phone Project
        run: |
          mkdir -p app/src/main/java/com/vistastream/iptv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VistaStreamIPTV"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vistastream.iptv"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.vistastream.iptv"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
          }
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:banner="@drawable/tv_banner"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.VistaStream"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:exported="true"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">VistaStream IPTV</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VistaStream" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#090D16</item>
                  <item name="android:statusBarColor">#090D16</item>
                  <item name="android:navigationBarColor">#090D16</item>
              </style>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/java/com/vistastream/iptv/MainActivity.kt
          package com.vistastream.iptv

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var rootContainer: FrameLayout
              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null
              private val targetAppUrl = "https://vistastream-iptv-zdrkf4jxqq-ue.a.run.app"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  rootContainer = FrameLayout(this).apply { setBackgroundColor(Color.parseColor("#090D16")) }
                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#090D16"))
                      isFocusable = true
                      isFocusableInTouchMode = true
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          mediaPlaybackRequiresUserGesture = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          useWideViewPort = true
                          loadWithOverviewMode = true
                      }
                      CookieManager.getInstance().setAcceptCookie(true)
                      CookieManager.getInstance().setAcceptThirdPartyCookies(this, true)
                      webViewClient = object : WebViewClient() {}
                      webChromeClient = object : WebChromeClient() {
                          override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                              if (customView != null) { callback?.onCustomViewHidden(); return }
                              customView = view
                              customViewCallback = callback
                              webView.visibility = View.GONE
                              rootContainer.addView(view)
                          }
                          override fun onHideCustomView() {
                              customView?.let { rootContainer.removeView(it) }
                              customView = null
                              webView.visibility = View.VISIBLE
                              customViewCallback?.onCustomViewHidden()
                              customViewCallback = null
                          }
                      }
                  }
                  rootContainer.addView(webView)
                  setContentView(rootContainer)
                  webView.loadUrl(targetAppUrl)
                  webView.requestFocus()
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (customView != null) webView.webChromeClient?.onHideCustomView()
                          else if (webView.canGoBack()) webView.goBack()
                          else finish()
                      }
                  })
              }
          }
          EOF

